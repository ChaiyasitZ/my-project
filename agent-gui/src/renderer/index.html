<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>NetConfig Agent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Custom Title Bar -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-left">
      <svg class="titlebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
      </svg>
      <span>NetConfig Agent</span>
    </div>
    <div class="titlebar-right">
      <button class="titlebar-btn" id="btn-minimize" title="Minimize">
        <svg viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn close" id="btn-close" title="Close to tray">
        <svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>

  <div class="app">
    <!-- Status Bar -->
    <div class="status-bar" id="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Disconnected</span>
      <span class="status-version" id="status-version">v1.0.0</span>
    </div>

    <!-- Settings Section -->
    <div class="section" id="settings-section">
      <div class="section-header" onclick="toggleSection('settings')">
        <div class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          Connection Settings
        </div>
        <svg class="chevron" id="settings-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="section-body" id="settings-body">
        <div class="form-group">
          <label>Server URL</label>
          <input type="text" id="input-server" placeholder="https://your-server.vercel.app">
        </div>
        <div class="form-group">
          <label>Agent Name</label>
          <input type="text" id="input-name" placeholder="My Agent">
        </div>
        <div class="form-group">
          <label>Agent Token</label>
          <div class="token-input">
            <input type="password" id="input-token" placeholder="Paste token from web dashboard">
            <button class="btn-icon" id="btn-toggle-token" title="Show/hide token">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-save" id="btn-save">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save
          </button>
          <button class="btn btn-reconnect" id="btn-reconnect" title="Save settings and reconnect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6"/><path d="M2.5 22v-6h6"/><path d="M2 11.5a10 10 0 0 1 18.8-4.3"/><path d="M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
            Save &amp; Reconnect
          </button>
          <button class="btn btn-connect" id="btn-connect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
            Connect
          </button>
        </div>
      </div>
    </div>

    <!-- Ollama Section -->
    <div class="section" id="ollama-section">
      <div class="section-header" onclick="toggleSection('ollama')">
        <div class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
          Ollama AI
        </div>
        <div class="ollama-badge" id="ollama-badge">Checking...</div>
      </div>
      <div class="section-body collapsed" id="ollama-body">
        <div class="ollama-info" id="ollama-info">
          <div class="ollama-row"><span class="label">Status:</span><span id="ollama-status-text">—</span></div>
          <div class="ollama-row"><span class="label">Version:</span><span id="ollama-version">—</span></div>
          <div class="ollama-row"><span class="label">Model:</span><span id="ollama-model">—</span></div>
          <div class="ollama-row"><span class="label">Models:</span><span id="ollama-model-count">—</span></div>
        </div>
        <button class="btn btn-sm" id="btn-refresh-ollama">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6"/><path d="M2.5 22v-6h6"/><path d="M2 11.5a10 10 0 0 1 18.8-4.3"/><path d="M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
          Refresh
        </button>
      </div>
    </div>

    <!-- Activity Log -->
    <div class="section log-section">
      <div class="section-header">
        <div class="section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Activity Log
        </div>
        <button class="btn-icon" id="btn-clear-log" title="Clear log">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div class="log-container" id="log-container">
        <div class="log-empty" id="log-empty">No activity yet</div>
      </div>
    </div>


  </div>

  <script src="app.js"></script>
</body>
</html>
